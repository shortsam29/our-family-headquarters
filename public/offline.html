<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#626B58">
  <title>Our Family Headquarters — Offline</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#3f433d;background:#f7f2ea}*{box-sizing:border-box}body{display:grid;min-height:100vh;margin:0;place-items:center;padding:24px}.card{width:min(560px,100%);padding:48px;border:1px solid #ddd6cb;border-radius:30px;background:#fffdfc;box-shadow:0 14px 40px rgba(92,76,58,.12);text-align:center}img{width:120px;height:120px;border-radius:28px}h1{margin:24px 0 12px;font-family:Georgia,serif;font-size:clamp(2rem,7vw,3rem);color:#626b58}p{line-height:1.65;color:#666a63}button{min-height:48px;margin-top:16px;padding:0 24px;border:0;border-radius:999px;background:#626b58;color:#fffdfc;font:inherit;font-weight:700;cursor:pointer}button:focus-visible{outline:3px solid #626b58;outline-offset:3px}
  </style>
</head>
<body><main class="card"><img src="/icons/icon-192.png" alt=""><h1>Your family home is still here.</h1><p>The internet connection is resting for a moment. Reconnect to view protected household information or save changes.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
